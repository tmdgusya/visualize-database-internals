commands:
  install: pnpm install
  typecheck: tsc --noEmit
  build: pnpm build
  test: vitest run
  test:watch: vitest
  lint: eslint . --ext ts,tsx
  lint:fix: eslint . --ext ts,tsx --fix
  dev: pnpm dev
  preview: pnpm preview

services:
  dev-server:
    start: pnpm dev --port 3100
    stop: lsof -ti :3100 | xargs kill -9 2>/dev/null || true
    healthcheck: curl -sf http://localhost:3100 || exit 1
    port: 3100
    depends_on: []

  preview-server:
    start: pnpm preview --port 3101
    stop: lsof -ti :3101 | xargs kill -9 2>/dev/null || true
    healthcheck: curl -sf http://localhost:3101 || exit 1
    port: 3101
    depends_on: []
